<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐍 贪吃蛇游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #2E7D32;
            margin-bottom: 20px;
            font-size: 36px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #4CAF50 0%, #2E7D32 100%);
            border-radius: 10px;
            color: white;
        }

        .high-score {
            font-size: 18px;
            font-weight: bold;
        }

        .header-buttons {
            display: flex;
            gap: 10px;
        }

        .header-btn {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
            text-decoration: none;
        }

        .header-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        .header-btn:active {
            transform: translateY(0);
        }

        .ai-skin-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .skin-loading-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            border-radius: 10px;
            z-index: 150;
        }

        .skin-loading-overlay.show {
            display: flex;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255, 255, 255, 0.3);
            border-top: 5px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            color: white;
            font-size: 18px;
            text-align: center;
        }

        .loading-progress {
            color: #667eea;
            font-size: 14px;
            margin-top: 10px;
        }

        .game-canvas {
            display: block;
            margin: 0 auto 20px;
            border: 4px solid #2E7D32;
            border-radius: 10px;
            background: #1E1E1E;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-box {
            padding: 15px;
            text-align: center;
            background: #f5f5f5;
            border-radius: 10px;
            border: 2px solid #ddd;
        }

        .stat-label {
            font-size: 14px;
            color: #666;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2E7D32;
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .control-box {
            padding: 10px;
            text-align: center;
            background: #f9f9f9;
            border-radius: 8px;
            font-size: 14px;
            color: #666;
        }

        .key {
            display: inline-block;
            padding: 4px 8px;
            background: #2E7D32;
            color: white;
            border-radius: 4px;
            font-size: 12px;
            margin: 0 2px;
        }

        .game-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            color: white;
            display: none;
            z-index: 100;
        }

        .game-overlay.show {
            display: block;
        }

        .game-overlay h2 {
            font-size: 36px;
            margin-bottom: 20px;
        }

        .game-overlay p {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .game-overlay .final-score {
            font-size: 48px;
            color: #4CAF50;
            margin: 20px 0;
        }

        .game-overlay .new-record {
            color: #FF9800;
            font-size: 28px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .level-up {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(76, 175, 80, 0.9);
            color: white;
            padding: 30px 50px;
            border-radius: 15px;
            font-size: 32px;
            font-weight: bold;
            display: none;
            z-index: 50;
            animation: popIn 0.3s ease-out;
        }

        .level-up.show {
            display: block;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        .mobile-controls {
            display: none;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: grid;
                grid-template-areas:
                    ". up ."
                    "left down right";
                gap: 10px;
                max-width: 200px;
                margin: 20px auto;
            }

            .mobile-btn {
                padding: 15px;
                background: #4CAF50;
                color: white;
                border: none;
                border-radius: 10px;
                font-size: 24px;
                cursor: pointer;
                transition: transform 0.1s;
            }

            .mobile-btn:active {
                transform: scale(0.95);
            }

            .mobile-btn.up { grid-area: up; }
            .mobile-btn.down { grid-area: down; }
            .mobile-btn.left { grid-area: left; }
            .mobile-btn.right { grid-area: right; }

            .game-canvas {
                width: 100%;
                height: auto;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐍 贪吃蛇游戏</h1>

        <div class="header">
            <div>🎮 经典游戏</div>
            <div class="header-buttons">
                <a href="/ranking" class="header-btn">🏆 排行榜</a>
                <button class="header-btn ai-skin-btn" onclick="generateAISkin()">✨ AI 生成皮肤</button>
                <div class="high-score">🏆 最高分: <span id="highScore">0</span></div>
            </div>
        </div>

        <div class="game-wrapper" style="position: relative;">
            <canvas id="gameCanvas" class="game-canvas" width="600" height="400"></canvas>

            <div id="startOverlay" class="game-overlay show">
                <h2>🐍 贪吃蛇</h2>
                <p>按 <span class="key">空格键</span> 开始游戏</p>
                <p style="font-size: 16px; margin-top: 20px; opacity: 0.8;">
                    使用方向键或 WASD 控制方向
                </p>
            </div>

            <div id="pauseOverlay" class="game-overlay">
                <h2>⏸️ 游戏暂停</h2>
                <p>按 <span class="key">空格键</span> 继续</p>
            </div>

            <div id="gameOverOverlay" class="game-overlay">
                <h2>💀 游戏结束</h2>
                <p>最终得分</p>
                <div class="final-score" id="finalScore">0</div>
                <div class="new-record" id="newRecord" style="display: none;">🎉 新纪录！</div>
                <p style="font-size: 18px; margin-top: 20px;">按 <span class="key">R键</span> 重新开始</p>
            </div>

            <div id="levelUp" class="level-up">
                🚀 升级到 Level <span id="newLevel">2</span>!
                <div style="font-size: 20px; margin-top: 10px;">速度提升!</div>
            </div>

            <div id="skinLoadingOverlay" class="skin-loading-overlay">
                <div class="loading-spinner"></div>
                <div class="loading-text">正在生成 AI 皮肤...</div>
                <div class="loading-progress" id="loadingProgress">准备中...</div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-box">
                <div class="stat-label">得分</div>
                <div class="stat-value" id="score">0</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">关卡</div>
                <div class="stat-value" id="level">1</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">速度</div>
                <div class="stat-value" id="speed">200ms</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-box">
                <span class="key">↑</span><span class="key">↓</span><span class="key">←</span><span class="key">→</span> 移动
            </div>
            <div class="control-box">
                <span class="key">空格</span> 暂停/开始
            </div>
            <div class="control-box">
                <span class="key">R</span> 重新开始
            </div>
            <div class="control-box">
                <span class="key">P</span> 暂停/继续
            </div>
        </div>

        <div class="mobile-controls">
            <button class="mobile-btn up" onclick="setDirection(0, -1)">↑</button>
            <button class="mobile-btn left" onclick="setDirection(-1, 0)">←</button>
            <button class="mobile-btn down" onclick="setDirection(0, 1)">↓</button>
            <button class="mobile-btn right" onclick="setDirection(1, 0)">→</button>
        </div>
    </div>

    <script>
        // ==================== 游戏配置 ====================
        const GRID_SIZE = 20; // 网格大小
        const CANVAS_WIDTH = 600;
        const CANVAS_HEIGHT = 400;
        const COLS = CANVAS_WIDTH / GRID_SIZE;
        const ROWS = CANVAS_HEIGHT / GRID_SIZE;

        // ==================== 游戏状态 ====================
        const gameState = {
            snake: [],
            direction: { x: 1, y: 0 }, // 初始向右移动
            nextDirection: { x: 1, y: 0 }, // 缓冲下一个方向
            food: { x: 0, y: 0 },
            score: 0,
            level: 1,
            speed: 200,
            isRunning: false,
            isPaused: false,
            highScore: 0,
            foodEaten: 0, // 当前关卡吃的食物数
            gameLoop: null,
            skinTexture: null, // AI 生成的皮肤纹理
            isSkinLoading: false // 是否正在加载皮肤
        };

        // ==================== DOM 元素 ====================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const levelElement = document.getElementById('level');
        const speedElement = document.getElementById('speed');
        const highScoreElement = document.getElementById('highScore');
        const startOverlay = document.getElementById('startOverlay');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const gameOverOverlay = document.getElementById('gameOverOverlay');
        const finalScoreElement = document.getElementById('finalScore');
        const newRecordElement = document.getElementById('newRecord');
        const levelUpElement = document.getElementById('levelUp');
        const newLevelElement = document.getElementById('newLevel');

        // ==================== 初始化 ====================
        function init() {
            // 读取最高分
            gameState.highScore = parseInt(localStorage.getItem('snakeGameHighScore')) || 0;
            highScoreElement.textContent = gameState.highScore;

            // 读取保存的皮肤
            const savedSkin = localStorage.getItem('snakeGameSkin');
            if (savedSkin) {
                loadSkinTexture(savedSkin);
            }

            // 绘制初始界面
            draw();
        }

        // ==================== 游戏控制 ====================
        function startGame() {
            // 重置游戏状态
            gameState.snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 }
            ];
            gameState.direction = { x: 1, y: 0 };
            gameState.nextDirection = { x: 1, y: 0 };
            gameState.score = 0;
            gameState.level = 1;
            gameState.speed = 200;
            gameState.isRunning = true;
            gameState.isPaused = false;
            gameState.foodEaten = 0;

            // 生成第一个食物
            generateFood();

            // 更新UI
            updateUI();
            hideOverlays();

            // 开始游戏循环
            gameLoop();
        }

        function pauseGame() {
            if (!gameState.isRunning) return;

            gameState.isPaused = !gameState.isPaused;

            if (gameState.isPaused) {
                pauseOverlay.classList.add('show');
            } else {
                pauseOverlay.classList.remove('show');
                gameLoop();
            }
        }

        function gameOver() {
            gameState.isRunning = false;

            // 检查是否打破纪录
            const isNewRecord = gameState.score > gameState.highScore;
            if (isNewRecord) {
                gameState.highScore = gameState.score;
                localStorage.setItem('snakeGameHighScore', gameState.highScore);
                highScoreElement.textContent = gameState.highScore;
            }

            // 显示游戏结束界面
            finalScoreElement.textContent = gameState.score;
            newRecordElement.style.display = isNewRecord ? 'block' : 'none';
            gameOverOverlay.classList.add('show');
        }

        // ==================== 游戏逻辑 ====================
        function gameLoop() {
            if (!gameState.isRunning || gameState.isPaused) return;

            // 移动蛇
            moveSnake();

            // 检测碰撞
            if (checkCollision()) {
                gameOver();
                return;
            }

            // 检测食物
            checkFood();

            // 绘制界面
            draw();

            // 更新UI
            updateUI();

            // 继续循环
            gameState.gameLoop = setTimeout(gameLoop, gameState.speed);
        }

        function moveSnake() {
            // 更新方向
            gameState.direction = { ...gameState.nextDirection };

            // 计算新蛇头位置
            const head = { ...gameState.snake[0] };
            head.x += gameState.direction.x;
            head.y += gameState.direction.y;

            // 添加新蛇头
            gameState.snake.unshift(head);
        }

        function checkCollision() {
            const head = gameState.snake[0];

            // 检测撞墙
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                return true;
            }

            // 检测撞自己
            for (let i = 1; i < gameState.snake.length; i++) {
                if (head.x === gameState.snake[i].x && head.y === gameState.snake[i].y) {
                    return true;
                }
            }

            return false;
        }

        function checkFood() {
            const head = gameState.snake[0];

            // 检测是否吃到食物
            if (head.x === gameState.food.x && head.y === gameState.food.y) {
                // 得分
                gameState.score += 10;
                gameState.foodEaten++;

                // 检查是否升级
                if (gameState.foodEaten >= 5) {
                    levelUp();
                }

                // 生成新食物
                generateFood();
            } else {
                // 没吃到食物，移除蛇尾
                gameState.snake.pop();
            }
        }

        function generateFood() {
            // 随机生成食物位置
            let newFood;
            do {
                newFood = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
            } while (isOnSnake(newFood));

            gameState.food = newFood;
        }

        function isOnSnake(pos) {
            return gameState.snake.some(segment =>
                segment.x === pos.x && segment.y === pos.y
            );
        }

        function levelUp() {
            // 升级
            gameState.level++;
            gameState.foodEaten = 0;

            // 关卡奖励
            gameState.score += 50;

            // 计算新速度
            if (gameState.level <= 5) {
                gameState.speed = 200 - (gameState.level - 1) * 20;
            } else if (gameState.level <= 10) {
                gameState.speed = 120 - (gameState.level - 5) * 10;
            } else {
                gameState.speed = 60; // 最快速度
            }

            // 显示升级提示
            showLevelUp();
        }

        // ==================== 绘制函数 ====================
        function draw() {
            // 清空画布
            ctx.fillStyle = '#1E1E1E';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // 绘制网格线
            ctx.strokeStyle = '#333333';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID_SIZE, 0);
                ctx.lineTo(i * GRID_SIZE, CANVAS_HEIGHT);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * GRID_SIZE);
                ctx.lineTo(CANVAS_WIDTH, i * GRID_SIZE);
                ctx.stroke();
            }

            // 绘制食物
            drawFood();

            // 绘制蛇
            drawSnake();
        }

        function drawSnake() {
            gameState.snake.forEach((segment, index) => {
                // 使用 AI 生成的皮肤纹理或默认颜色
                if (gameState.skinTexture) {
                    // 使用纹理绘制
                    const pattern = ctx.createPattern(gameState.skinTexture, 'repeat');
                    ctx.fillStyle = pattern;
                } else {
                    // 蛇头和蛇身不同颜色
                    if (index === 0) {
                        ctx.fillStyle = '#2E7D32'; // 深绿色蛇头
                    } else {
                        ctx.fillStyle = '#4CAF50'; // 浅绿色蛇身
                    }
                }

                // 绘制蛇段
                ctx.fillRect(
                    segment.x * GRID_SIZE + 1,
                    segment.y * GRID_SIZE + 1,
                    GRID_SIZE - 2,
                    GRID_SIZE - 2
                );

                // 蛇头画眼睛
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 3;
                    const eyeOffset = 5;

                    if (gameState.direction.x === 1) { // 向右
                        ctx.fillRect(segment.x * GRID_SIZE + GRID_SIZE - eyeOffset - eyeSize,
                                     segment.y * GRID_SIZE + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * GRID_SIZE + GRID_SIZE - eyeOffset - eyeSize,
                                     segment.y * GRID_SIZE + GRID_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (gameState.direction.x === -1) { // 向左
                        ctx.fillRect(segment.x * GRID_SIZE + eyeOffset,
                                     segment.y * GRID_SIZE + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * GRID_SIZE + eyeOffset,
                                     segment.y * GRID_SIZE + GRID_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    } else if (gameState.direction.y === -1) { // 向上
                        ctx.fillRect(segment.x * GRID_SIZE + eyeOffset,
                                     segment.y * GRID_SIZE + eyeOffset, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * GRID_SIZE + GRID_SIZE - eyeOffset - eyeSize,
                                     segment.y * GRID_SIZE + eyeOffset, eyeSize, eyeSize);
                    } else { // 向下
                        ctx.fillRect(segment.x * GRID_SIZE + eyeOffset,
                                     segment.y * GRID_SIZE + GRID_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                        ctx.fillRect(segment.x * GRID_SIZE + GRID_SIZE - eyeOffset - eyeSize,
                                     segment.y * GRID_SIZE + GRID_SIZE - eyeOffset - eyeSize, eyeSize, eyeSize);
                    }
                }
            });
        }

        function drawFood() {
            // 绘制红色食物（圆形）
            const centerX = gameState.food.x * GRID_SIZE + GRID_SIZE / 2;
            const centerY = gameState.food.y * GRID_SIZE + GRID_SIZE / 2;
            const radius = GRID_SIZE / 2 - 2;

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
            ctx.fillStyle = '#F44336';
            ctx.fill();

            // 添加闪烁效果
            ctx.beginPath();
            ctx.arc(centerX - 2, centerY - 2, radius / 3, 0, 2 * Math.PI);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.fill();
        }

        // ==================== UI 更新 ====================
        function updateUI() {
            scoreElement.textContent = gameState.score;
            levelElement.textContent = gameState.level;
            speedElement.textContent = gameState.speed + 'ms';
        }

        function hideOverlays() {
            startOverlay.classList.remove('show');
            pauseOverlay.classList.remove('show');
            gameOverOverlay.classList.remove('show');
            levelUpElement.classList.remove('show');
        }

        function showLevelUp() {
            newLevelElement.textContent = gameState.level;
            levelUpElement.classList.add('show');

            // 2秒后隐藏
            setTimeout(() => {
                levelUpElement.classList.remove('show');
            }, 2000);
        }

        // ==================== 键盘控制 ====================
        document.addEventListener('keydown', (event) => {
            // 空格键：开始/暂停
            if (event.code === 'Space') {
                event.preventDefault();
                if (!gameState.isRunning) {
                    startGame();
                } else {
                    pauseGame();
                }
                return;
            }

            // R键：重新开始
            if (event.code === 'KeyR') {
                event.preventDefault();
                startGame();
                return;
            }

            // P键：暂停/继续
            if (event.code === 'KeyP') {
                event.preventDefault();
                if (gameState.isRunning) {
                    pauseGame();
                }
                return;
            }

            // 方向键控制
            switch (event.code) {
                case 'ArrowUp':
                case 'KeyW':
                    event.preventDefault();
                    setDirection(0, -1);
                    break;
                case 'ArrowDown':
                case 'KeyS':
                    event.preventDefault();
                    setDirection(0, 1);
                    break;
                case 'ArrowLeft':
                case 'KeyA':
                    event.preventDefault();
                    setDirection(-1, 0);
                    break;
                case 'ArrowRight':
                case 'KeyD':
                    event.preventDefault();
                    setDirection(1, 0);
                    break;
            }
        });

        function setDirection(x, y) {
            // 防止直接掉头
            if (gameState.direction.x === -x && gameState.direction.y === -y) {
                return;
            }

            // 防止多次快速输入导致的冲突
            if (gameState.nextDirection.x === -x && gameState.nextDirection.y === -y) {
                return;
            }

            gameState.nextDirection = { x, y };
        }

        // ==================== AI 皮肤生成 ====================
        async function generateAISkin() {
            // 如果正在加载，阻止重复点击
            if (gameState.isSkinLoading) {
                return;
            }

            // 显示加载动画
            showSkinLoading();

            try {
                // 调用 AI 皮肤生成 API
                const response = await fetch('/api/agent', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        prompt: 'a cute cartoon snake skin with colorful pattern',
                        style: 'cartoon',
                        width: 512,
                        height: 512,
                        player_id: 'player_' + Math.floor(Math.random() * 10000)
                    })
                });

                if (!response.ok) {
                    throw new Error('生成失败: ' + response.statusText);
                }

                const result = await response.json();

                if (result.success && result.image_url) {
                    // 轮询查询生成状态
                    await pollSkinStatus(result.task_id);
                } else {
                    throw new Error(result.message || '生成失败');
                }

            } catch (error) {
                console.error('AI 皮肤生成失败:', error);
                alert('AI 皮肤生成失败: ' + error.message);
                hideSkinLoading();
            }
        }

        async function pollSkinStatus(taskId) {
            const maxAttempts = 60; // 最多轮询 60 次（约 60 秒）
            let attempts = 0;

            const pollInterval = setInterval(async () => {
                attempts++;

                try {
                    const response = await fetch(`/api/agent/status/${taskId}`);

                    if (!response.ok) {
                        throw new Error('查询状态失败');
                    }

                    const result = await response.json();

                    // 更新进度
                    if (result.progress !== undefined) {
                        updateLoadingProgress(result.progress);
                    }

                    // 检查是否完成
                    if (result.status === 'completed') {
                        clearInterval(pollInterval);

                        // 加载皮肤纹理
                        await loadSkinTexture(result.image_url);

                        // 保存皮肤到本地存储
                        localStorage.setItem('snakeGameSkin', result.image_url);

                        // 隐藏加载动画
                        hideSkinLoading();

                        // 显示成功提示
                        alert('AI 皮肤生成成功！已应用到游戏。');

                    } else if (result.status === 'failed') {
                        clearInterval(pollInterval);
                        throw new Error(result.message || '生成失败');

                    } else if (attempts >= maxAttempts) {
                        clearInterval(pollInterval);
                        throw new Error('生成超时');
                    }

                } catch (error) {
                    clearInterval(pollInterval);
                    throw error;
                }

            }, 1000); // 每秒轮询一次
        }

        async function loadSkinTexture(imageUrl) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';

                img.onload = () => {
                    // 创建离屏 canvas 来调整图片大小到网格大小
                    const tempCanvas = document.createElement('canvas');
                    const tempCtx = tempCanvas.getContext('2d');
                    tempCanvas.width = GRID_SIZE;
                    tempCanvas.height = GRID_SIZE;

                    // 绘制并缩放图片
                    tempCtx.drawImage(img, 0, 0, GRID_SIZE, GRID_SIZE);

                    // 创建 pattern
                    gameState.skinTexture = tempCanvas;
                    resolve();
                };

                img.onerror = () => {
                    reject(new Error('图片加载失败'));
                };

                img.src = imageUrl;
            });
        }

        function showSkinLoading() {
            gameState.isSkinLoading = true;
            const overlay = document.getElementById('skinLoadingOverlay');
            overlay.classList.add('show');
            updateLoadingProgress(0);
        }

        function hideSkinLoading() {
            gameState.isSkinLoading = false;
            const overlay = document.getElementById('skinLoadingOverlay');
            overlay.classList.remove('show');
        }

        function updateLoadingProgress(progress) {
            const progressText = document.getElementById('loadingProgress');
            const messages = {
                0: '准备中...',
                10: '上传请求...',
                30: 'AI 正在生成...',
                50: '生成中...',
                70: '生成中...',
                90: '即将完成...',
                100: '加载图片...'
            };

            // 根据进度选择合适的提示信息
            let message = messages[Math.floor(progress / 10) * 10] || '生成中...';
            progressText.textContent = `${message} (${progress}%)`;
        }

        // ==================== 初始化 ====================
        init();
    </script>
</body>
</html>
