version: '3.8'

services:
  # Flask 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: remake-ai-backend
    ports:
      - "5000:5000"
    environment:
      # Flask 配置
      - FLASK_ENV=${FLASK_ENV:-production}
      - FLASK_PORT=${FLASK_PORT:-5000}
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      # ComfyUI 配置
      - COMFYUI_URL=${COMFYUI_URL:-http://host.docker.internal:8188}
      - COMFYUI_API_KEY=${COMFYUI_API_KEY:-}
      - COMFYUI_TIMEOUT=${COMFYUI_TIMEOUT:-120}
      # Dify 配置
      - DIFY_API_KEY=${DIFY_API_KEY:-}
      - DIFY_API_URL=${DIFY_API_URL:-}
      # 数据库配置
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # 持久化数据库文件（开发环境使用SQLite）
      - ./backend/data:/app/data
      # 持久化生成的图片
      - ./backend/images:/app/images
      # 持久化日志文件
      - ./backend/logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - remake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # PostgreSQL 数据库服务
  db:
    image: postgres:15-alpine
    container_name: remake-ai-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-remake_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-remake_ai}
    volumes:
      # 持久化数据库数据
      - postgres_data:/var/lib/postgresql/data
      # 初始化脚本
      - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    networks:
      - remake-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-remake_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Nginx 反向代理（可选，用于生产环境）
  nginx:
    image: nginx:alpine
    container_name: remake-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    networks:
      - remake-network
    restart: unless-stopped
    profiles:
      - production

networks:
  remake-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
